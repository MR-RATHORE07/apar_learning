{% extends 'base.html' %}

{% block title %}Quiz Result{% endblock %}

{% block content %}
<div class="quiz-result">
    <h2>Quiz Result: {{ attempt.quiz.title }}</h2>
    <p>Your Score: {{ attempt.score }}%</p>
    <p>Completed at: {{ attempt.completed_at }}</p>
    <a href="{% url 'course_detail' attempt.quiz.course.id %}">Back to Course</a>
</div>
{% endblock %}
